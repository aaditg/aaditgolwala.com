name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  links:
    # Dead links are the most common way a portfolio site embarrasses you, and
    # the one thing nobody remembers to check by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir resolves "/..." hrefs against the build output.
          # The canonical host is excluded: checking your own site here would
          # be circular, and uptime.yml already watches whether it is live.
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,999
            --root-dir "${{ github.workspace }}/dist"
            --fallback-extensions html
            --exclude '^https://aaditgolwala\.com'
            'dist/**/*.html'
          fail: true

  secrets-scan:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
