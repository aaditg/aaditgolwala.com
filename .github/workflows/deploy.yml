name: Deploy

# Builds and ships to Cloudflare Workers (static assets) on every push to main.
# Requires two repository secrets — Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (template: "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
# Until they exist this job fails fast; CI still passes independently.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
